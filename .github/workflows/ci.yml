name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned to commit SHAs; the comment is the tag they were taken from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests in five time zones
        run: npm run test:zones
      - name: Unit tests on a small JS stack (a phone has less than Node)
        run: npm run test:small-stack
      - name: Expo doctor
        run: npx --yes expo-doctor@1.21.8
      - name: Build web
        run: npm run build:web
      - name: Bundle for iOS and Android
        run: npx expo export --platform ios --platform android --output-dir dist-native
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end test (web build, 390x844)
        run: npm run e2e
